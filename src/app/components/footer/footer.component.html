<footer class="themes">
  @for (theme of themes | keyvalue; track theme) {
    <label>
      <input [id]="theme.key" type="radio" [value]="theme.key" name="themeChooser" [checked]="theme.key === selected" (change)="changeTheme(theme.key)">
      {{ theme.value | titlecase }}
    </label>
  }
</footer>
